{% extends "base.html" %}
{% block title %}Camera Feed{% endblock %}
{% block page_title %}Live Camera Feed{% endblock %}

{% block content %}
<div class="pink-line"></div>

<div class="card" style="max-width:1100px;margin:0 auto">
  <div class="card-header">
    <h2 class="card-title">Live Stream</h2>
    <span class="badge badge-pink" id="stream-status">Connecting…</span>
  </div>
  <div class="card-body" style="padding:0">
    <div class="camera-container" style="border:none;border-radius:0">
      <img src="{{ url_for('camera.stream') }}"
           class="camera-feed"
           alt="Live camera feed"
           id="camera-img"
           style="width:100%;height:auto;display:block" />
      <div class="camera-overlay" aria-hidden="true">
        <div class="camera-corner camera-corner-tl"></div>
        <div class="camera-corner camera-corner-tr"></div>
        <div class="camera-corner camera-corner-bl"></div>
        <div class="camera-corner camera-corner-br"></div>
        <div class="camera-status-bar">
          <div class="camera-live-dot">
            <div class="live-indicator"></div>
            <span id="camera-status-text">WAITING</span>
          </div>
          <span style="color:rgba(255,255,255,.7);font-size:.75rem;font-family:var(--font-mono)">
            Broadcaster: {{ broadcaster_username }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
// ── Stream status polling ─────────────────────────────────────────────────────
let wasOffline = true;
let offlineSince = null;           // timestamp of first offline poll
const OFFLINE_DEBOUNCE_MS = 30000; // only flip to Waiting after 30s of no stream

function pollStatus() {
  fetch('{{ url_for("camera.status") }}')
    .then(r => r.json())
    .then(d => {
      const streamStatus = document.getElementById('stream-status');
      const statusText   = document.getElementById('camera-status-text');
      if (d.online) {
        offlineSince = null; // reset debounce timer
        if (streamStatus) { streamStatus.className='badge badge-success'; streamStatus.textContent='Live'; }
        if (statusText)   statusText.textContent = 'LIVE';
        if (wasOffline) {
          let streamImg = document.getElementById('camera-img');
          if (!streamImg) {
            streamImg = document.querySelector('.camera-feed');
          }
          if (streamImg) {
            streamImg.id  = 'camera-img';
            streamImg.src = '{{ url_for("camera.stream") }}?' + Date.now();
            streamImg.style.minHeight = '';
          }
        }
        wasOffline = false;
      } else {
        // Start debounce timer on first offline poll
        if (offlineSince === null) offlineSince = Date.now();
        // Only switch to Waiting after 30s of consistently no stream
        if (Date.now() - offlineSince >= OFFLINE_DEBOUNCE_MS) {
          if (streamStatus) { streamStatus.className='badge badge-warning'; streamStatus.textContent='Waiting for broadcaster…'; }
          if (statusText)   statusText.textContent = 'WAITING';
          wasOffline = true;
        }
      }
    }).catch(() => {});
}
pollStatus();
setInterval(pollStatus, 2000);
</script>
{% endblock %}
