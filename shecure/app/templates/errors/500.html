<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Error | SHEcure</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:var(--pink-50)">
  <div style="text-align:center;max-width:420px;padding:2rem">
    <div style="font-size:4rem;margin-bottom:1rem" aria-hidden="true">⚠️</div>
    <h1 style="font-family:var(--font-display);font-size:2.5rem;color:var(--pink-700);margin-bottom:.5rem">
      Something went wrong
    </h1>
    <p style="color:var(--gray-600);margin-bottom:2rem">
      An internal server error occurred. The error has been logged.
      Please try again or contact the administrator.
    </p>
    <a href="/login" class="btn btn-primary" style="margin-top:1rem">
      ← Return to Login
    </a>
  </div>
</body>
</html>
